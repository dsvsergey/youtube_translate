<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Live Translate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="title-row">
      <h1>YouTube Live Translate</h1>
      <select id="uiLang" class="ui-lang" aria-label="Interface language / Мова інтерфейсу" data-i18n-title="uiLang">
        <option value="auto" data-i18n="uiLangAuto"></option>
        <option value="en">English</option>
        <option value="uk">Українська</option>
      </select>
    </div>
    <label class="toggle">
      <input type="checkbox" id="enabled" role="switch">
      <span class="toggle-track" aria-hidden="true"></span>
      <span class="toggle-text">
        <b id="enabledLabel" data-i18n="translationOn"></b>
        <small data-i18n="toggleHint"></small>
      </span>
    </label>
  </header>

  <main>

  <label class="field">
    <span data-i18n="targetLang"></span>
    <select id="targetLang">
      <option value="uk">Українська</option>
      <option value="en">English</option>
      <option value="pl">Polski</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="it">Italiano</option>
      <option value="pt">Português</option>
      <option value="cs">Čeština</option>
      <option value="tr">Türkçe</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="zh-CN">中文</option>
    </select>
  </label>

  <label class="check"><input type="checkbox" id="speak"> <span data-i18n="speak"></span></label>
  <label class="check"><input type="checkbox" id="showOriginal"> <span data-i18n="showOriginal"></span></label>

  <label class="field">
    <span data-i18n="voice"></span>
    <select id="voiceName"><option value="" data-i18n="voiceAuto"></option></select>
  </label>

  <label class="field">
    <span><span data-i18n="rate"></span> <output id="rateOut"></output></span>
    <input type="range" id="rate" min="0.7" max="1.8" step="0.05">
  </label>

  <label class="field">
    <span><span data-i18n="duckVolume"></span> <output id="duckOut"></output></span>
    <input type="range" id="duckVolume" min="0" max="1" step="0.05">
  </label>

  <label class="field">
    <span><span data-i18n="fontSize"></span> <output id="fontOut"></output></span>
    <input type="range" id="fontSize" min="14" max="40" step="1">
  </label>

  <h2 data-i18n="noSubsHeading"></h2>
  <label class="check"><input type="checkbox" id="sttEnabled"> <span data-i18n="sttEnabled"></span></label>

  <label class="field">
    <span data-i18n="deepgramKey"></span>
    <input type="password" id="deepgramKey" data-i18n-placeholder="deepgramKeyPlaceholder" autocomplete="off" spellcheck="false">
  </label>

  <label class="field">
    <span data-i18n="videoLang"></span>
    <select id="sttLanguage">
      <option value="multi" data-i18n="sttAuto"></option>
      <option value="en">English</option>
      <option value="uk">Українська</option>
      <option value="ru">Русский</option>
      <option value="pl">Polski</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="it">Italiano</option>
      <option value="pt">Português</option>
      <option value="cs">Čeština</option>
      <option value="tr">Türkçe</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="zh">中文</option>
    </select>
  </label>

  <p class="hint" data-i18n="sttHint"></p>

  </main>

  <footer id="support" hidden>
    <span data-i18n="supportPrompt"></span>
    <div id="donateLinks" class="donate-links"></div>
  </footer>

  <script src="../src/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
